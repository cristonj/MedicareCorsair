name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependency
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install pyinstaller==6.22.3 -r requirements.txt
          npm ci
      - name: Test
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -v
          node --test tests/test_extension.cjs tests/test_install.cjs
      - name: Build executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/MedicareCorsair.exe).Hash.ToLowerInvariant()
          "$hash  MedicareCorsair.exe" | Set-Content -Encoding ascii dist/MedicareCorsair.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MedicareCorsair-Windows
          path: |
            dist/MedicareCorsair.exe
            dist/MedicareCorsair.exe.sha256
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: AppleSilicon
            asset: MedicareCorsair-macOS.zip
          - runner: macos-15-intel
            arch: Intel
            asset: MedicareCorsair-macOS-Intel.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependency
        run: |
          python -m pip install pyinstaller==6.22.3 -r requirements.txt
          npm ci
      - name: Build macOS app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name MedicareCorsair --collect-all pypdfium2 --add-data 'extension:extension' --add-data 'setup-guides.json:.' --add-data 'assets:assets' --add-data 'backend/ocr.cjs:backend' --add-data 'node_modules:node_modules' --add-binary "$(command -v node):runtime" desktop.py
          ditto -c -k --sequesterRsrc --keepParent dist/MedicareCorsair.app "dist/${{ matrix.asset }}"
          cd dist
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: MedicareCorsair-macOS-${{ matrix.arch }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MedicareCorsair-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/MedicareCorsair.exe
            release/MedicareCorsair.exe.sha256
            release/MedicareCorsair-macOS.zip
            release/MedicareCorsair-macOS.zip.sha256
            release/MedicareCorsair-macOS-Intel.zip
            release/MedicareCorsair-macOS-Intel.zip.sha256
